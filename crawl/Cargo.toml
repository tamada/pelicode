[package]
name = "pelicode-crawl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Crawler fetching package sources from PyPI, Maven Central, the Go module proxy, RubyGems and crates.io, for pelicode"
keywords = ["crawler", "pypi", "maven", "crates-io", "rubygems"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
base64 = "0.23.1"
flate2 = "1.1.10"
httpdate = "1.0.3"
humantime = "2.4.0"
pelicode-core.workspace = true
pelicode-db.workspace = true
rayon = "1.12.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
ureq = "3.4.2"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
