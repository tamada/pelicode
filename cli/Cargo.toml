[package]
name = "pelicode-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
pelicode-core = { version = "0.1.0", path = "../core" }
pelicode-crawl = { version = "0.1.0", path = "../crawl" }
pelicode-db = { version = "0.1.0", path = "../db" }
pelicode-detect = { version = "0.1.0", path = "../detect" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[[bin]]
name = "pelicode"
path = "src/main.rs"
