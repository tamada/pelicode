[package]
name = "pelicode-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Know where your code came from: finds code similar to published open-source packages, function by function"
keywords = ["code-clone", "plagiarism", "license", "provenance", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
pelicode-core.workspace = true
pelicode-crawl.workspace = true
pelicode-db.workspace = true
pelicode-detect.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[[bin]]
name = "pelicode"
path = "src/main.rs"
