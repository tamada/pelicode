[package]
name = "pelicode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Know where your code came from: finds code similar to published open-source packages, function by function"
keywords = ["code-clone", "plagiarism", "license", "provenance", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
dirs = "7.0.0"
globset = "0.4.20"
json5 = "1.3"
pelicode-core.workspace = true
pelicode-crawl.workspace = true
pelicode-db.workspace = true
pelicode-detect.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "1.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
ureq = { version = "3.4.2", features = ["json"] }
zstd = "0.14.3"

[dev-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
zstd = "0.14.3"

[[bin]]
name = "pelicode"
path = "src/main.rs"
