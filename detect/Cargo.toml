[package]
name = "pelicode-detect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Search for functions similar to known open-source code, for pelicode"
keywords = ["code-clone", "fingerprint", "similarity"]
categories = ["development-tools"]

[dependencies]
ignore = "0.4.33"
pelicode-core.workspace = true
pelicode-db.workspace = true
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
