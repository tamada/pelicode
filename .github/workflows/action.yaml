name: test_action
on:
  push:
    branches:
      - "**"
    paths:
      - "action.yml"
      - "action/**"
      - "cli/**"
      - ".github/workflows/action.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build pelicode
        run: cargo build --locked --release -p pelicode-cli

      # A repository whose last commit adds a copy of a function of the database.
      - name: Prepare a repository and a database
        run: |
          target/release/pelicode index cli/tests/fixtures/project --db "$RUNNER_TEMP/ref.db" --min-tokens 10 --no-config
          repo="$RUNNER_TEMP/repo"
          git init -q "$repo"
          git -C "$repo" -c user.name=test -c user.email=test@example.com commit -q --allow-empty -m "Initial commit"
          cp cli/tests/fixtures/project/lib/stack.py "$repo/copied.py"
          git -C "$repo" add copied.py
          git -C "$repo" -c user.name=test -c user.email=test@example.com commit -q -m "Add a copy"

      - name: Run the action
        id: pelicode
        uses: ./
        with:
          pelicode-path: target/release/pelicode
          working-directory: ${{ runner.temp }}/repo
          database: ${{ runner.temp }}/ref.db
          range: HEAD~1..HEAD
          args: --min-tokens 10 --no-config
          upload-sarif: "false"

      - name: Check the results
        env:
          COUNT: ${{ steps.pelicode.outputs.candidates }}
          SARIF: ${{ runner.temp }}/repo/${{ steps.pelicode.outputs.sarif-file }}
        run: |
          echo "candidates: $COUNT"
          test "$COUNT" -gt 0
          jq -e '.runs[0].results[0].locations[0].physicalLocation.artifactLocation.uri == "copied.py"' "$SARIF"
          jq -e '.runs[0].results[0].ruleId == "exact-match"' "$SARIF"
