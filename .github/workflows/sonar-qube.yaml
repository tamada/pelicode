name: Sonar Qube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' # if SONAR_TOKEN was not given, skip this step to evade the CI failure.
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          args: >
            -Dsonar.projectKey=tamada_pelicode
            -Dsonar.organization=tamada
            -Dsonar.sources=core,db,detect,crawl,cli
            -Dsonar.exclusions=**/tests/fixtures/**
            -Dsonar.sourceEncoding=UTF-8
