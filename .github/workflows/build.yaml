name: build_products
on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # see every platform's result, rather than cancelling the rest on the first failure
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macOS-latest
          - windows-latest
          - windows-11-arm
    steps:
      # No openssl to set up on any platform: ureq speaks TLS through rustls. The C code of the
      # Tree-sitter grammars and of the bundled SQLite is compiled with the runner's C compiler.

      - name: Checkout project
        uses: actions/checkout@v7

      - name: Setup Rust
        run: |
            rustup update stable
            rustup default stable

      - name: Install cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
        run: |
            rustup component add llvm-tools-preview
            cargo install --locked cargo-llvm-cov

      # extractions/setup-just has no build for Windows on arm64; install-action has.
      - name: Install just
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just

      - name: Verify formatting
        run:
          just verify_format

      # Only ubuntu reports the coverage, so the other platforms just build and test.
      - name: Build and calculate coverages
        if: matrix.os == 'ubuntu-latest'
        run:
          just test

      - name: Build and test
        if: matrix.os != 'ubuntu-latest'
        run:
          just test_without_coverage

      # The coverage file (coverage.lcov) is generated by cargo test
      # which is defined in Justfile
      - name: Send Coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        if: matrix.os == 'ubuntu-latest'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: target/coverage.lcov
