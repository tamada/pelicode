name: publish_site_release_assets
on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: "the version to publish, such as 3.0.0"
        required: true
        type: string

jobs:
  # release-start takes a plain path, but on a pull request the version is only in the head
  # branch, so the path is resolved here.
  notes:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release/v') && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    outputs:
      path: ${{ steps.path.outputs.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Resolve the release notes
        id: path
        env:
          VERSION: ${{ inputs.version }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          version="${VERSION:-${HEAD_REF#release/}}"
          path=".github/release-notes/v${version#v}.md"
          if [ -f "$path" ]; then
            echo "path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$path not found; the notes will be generated"
          fi

  setup:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.head_ref, 'release/v') && github.event.pull_request.merged == true)
    uses: tamada/.github/.github/workflows/release-start.yaml@v1
    needs: notes
    with:
      # Empty on the pull request; the version comes from the head branch then.
      version: ${{ inputs.version }}
      release-notes: ${{ needs.notes.outputs.path }}
    permissions:
      contents: write

  publish:
    runs-on: ${{ matrix.os }}
    needs: setup
    outputs:
      appname: ${{ needs.setup.outputs.appname }}
      tag: ${{ needs.setup.outputs.tag }}
      version: ${{ needs.setup.outputs.version }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_linux_arm64
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_linux_amd64
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_darwin_arm64
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: ${{ needs.setup.outputs.appname }}
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_darwin_amd64
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ${{ needs.setup.outputs.appname }}.exe
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_windows_amd64
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact_name: ${{ needs.setup.outputs.appname }}.exe
            asset_name: ${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}_windows_arm64
            archive: zip

    steps:
      # initialization
      - name: Checkout the project
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      - name: Setup variables
        id: vars
        shell: bash
        run: |
          DIR=$(echo "${{ needs.setup.outputs.appname }}-${{ needs.setup.outputs.version }}")
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Rust
        run: rustup update stable

      # No openssl to set up: ureq speaks TLS through rustls. The cross toolchain also brings the
      # C compiler that the Tree-sitter grammars and the bundled SQLite need for arm64.
      - name: Setup for Linux
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release -p pelicode-cli --target ${{ matrix.target }}

      # publish release
      - name: Create release file
        shell: bash
        run: |
          DIR=${{ steps.vars.outputs.dir }}
          DIST=${{ matrix.target }}
          mkdir -p dist/$DIST/$DIR
          cp -r README.md LICENSE dist/$DIST/$DIR
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/$DIST/$DIR/
          # Windows users expect a zip. The Windows runners have no zip command, but PowerShell,
          # on x64 and arm64 alike, can make one.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist/$DIST && pwsh -NoProfile -Command "Compress-Archive -Path '$DIR' -DestinationPath '../${{ matrix.asset_name }}.zip'")
          else
            tar cvfz dist/${{ matrix.asset_name }}.tar.gz -C dist/$DIST $DIR
          fi

      - name: Upload the asset to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release upload "${{ needs.setup.outputs.tag }}" "dist/${{ matrix.asset_name }}.${{ matrix.archive }}" --clobber

  # Each architecture is built on a runner of its own architecture. Emulating arm64 through QEMU
  # took an hour of compiling Rust and produced enough intermediate layers to break the cache it
  # was writing; natively it is minutes. Neither runner produces a tag — each pushes an image by
  # digest, and docker_manifest gathers the digests into one multi-arch tag afterwards.
  docker:
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Name the platform for the artifact
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout the project
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ACCOUNT }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: quay.io/tama5/${{ needs.publish.outputs.appname }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Containerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VERSION=${{ needs.publish.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=quay.io/tama5/${{ needs.publish.outputs.appname }},push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags live here rather than on either build, so that one tag names both architectures.
  docker_manifest:
    needs: [publish, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ACCOUNT }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: quay.io/tama5/${{ needs.publish.outputs.appname }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,suffix=,format=short
            type=raw,value=${{ needs.publish.outputs.version }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: quay.io/tama5/${{ needs.publish.outputs.appname }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect what was published
        env:
          IMAGE: quay.io/tama5/${{ needs.publish.outputs.appname }}
        run: docker buildx imagetools inspect "$IMAGE:${{ needs.publish.outputs.version }}"

  publish_to_crates_io:
    needs: [setup, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the trusted publishing of crates.io uses OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Rust
        run: rustup update stable

      # The first release is published by hand (crates.io can set up trusted publishing only
      # for crates that exist), so crates already published at this version are skipped
      # instead of failing the release.
      - name: Check what is published already
        id: check
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          missing=0
          for crate in pelicode-core pelicode-db pelicode-detect pelicode-crawl pelicode-cli; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              -A "pelicode release (https://github.com/tamada/pelicode)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is on crates.io already"
            else
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "::notice::every crate of $VERSION is on crates.io already; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$missing" -ne 5 ]; then
            echo "::error::only some crates of $VERSION are on crates.io; publish the rest by hand"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        if: steps.check.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # The five crates depend on each other; --workspace publishes them in dependency order
      # (pelicode-core, pelicode-db, pelicode-detect, pelicode-crawl, then pelicode-cli).
      - name: Publish
        if: steps.check.outputs.skip != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --workspace

  finish:
    needs: [setup, publish, docker_manifest, publish_to_crates_io]
    uses: tamada/.github/.github/workflows/release-finish.yaml@v1
    with:
      tag: ${{ needs.setup.outputs.tag }}
    permissions:
      contents: write
    secrets: inherit
